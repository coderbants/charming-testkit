name: Publish to Crates.io

on:
  push:
    branches:
      - dev
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    name: Publish Crate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Format
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --all-targets -- -D warnings
      - name: Build
        run: cargo build --all-targets
      - name: Docgen
        run: cargo doc --no-deps
      - name: Test (all targets, all integration tests)
        run: cargo test --all-targets
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes
      - name: Upload source to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          src="${GITHUB_REPOSITORY##*/}-$GITHUB_REF_NAME.tar.gz"
          git archive --format=tar.gz -o "$src" HEAD
          gh release upload "$GITHUB_REF_NAME" "$src"
      # Every merge to the live branch publishes to crates.io. crates.io
      # rejects re-publishing an existing version, so the version-bump gate
      # in ci.yml must pass for any merge to land.
      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --token ${CARGO_REGISTRY_TOKEN}
